name: runall contract tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout runall
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.2'
      - name: Resolve locked executor tools
        run: dart pub get --enforce-lockfile --directory tools/cosmos_executor

      - name: Syntax check scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/lib/common.sh
          for script in scripts/*; do
            [[ -f "$script" ]] && bash -n "$script"
          done
          bash -n scripts/tests/run-contract-tests.sh
          node --check scripts/lib/native_digest.js
          dart analyze tools/cosmos_executor
          (cd tools/cosmos_executor && dart test)

      - name: Run contract tests
        shell: bash
        run: ./scripts/tests/run-contract-tests.sh
