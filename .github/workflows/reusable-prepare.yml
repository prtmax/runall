name: Cosmos build prepare

on:
  workflow_call:
    inputs:
      build_run_id:
        required: true
        type: string
      build_run_ids:
        required: false
        type: string
        default: ''
    outputs:
      has_android:
        description: Prepared has_android
        value: ${{ jobs.prepare.outputs.has_android }}
      has_ios:
        description: Prepared has_ios
        value: ${{ jobs.prepare.outputs.has_ios }}
      android_matrix:
        description: Prepared android_matrix
        value: ${{ jobs.prepare.outputs.android_matrix }}
      ios_matrix:
        description: Prepared ios_matrix
        value: ${{ jobs.prepare.outputs.ios_matrix }}
    secrets:
      COSMOS_BUILD_AUTH_EXCHANGE_URL:
        required: true
      COSMOS_BUILD_SPEC_URL:
        required: true
      COSMOS_BUILD_CALLBACK_URL:
        required: true
      COSMOS_BUILD_REPOSITORY_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has_android: ${{ steps.meta.outputs.has_android }}
      has_ios: ${{ steps.meta.outputs.has_ios }}
      android_matrix: ${{ steps.meta.outputs.android_matrix }}
      ios_matrix: ${{ steps.meta.outputs.ios_matrix }}
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      BUILD_RUN_IDS: ${{ inputs.build_run_ids }}
      COSMOS_BUILD_AUTH_EXCHANGE_URL: ${{ secrets.COSMOS_BUILD_AUTH_EXCHANGE_URL }}
      COSMOS_BUILD_SPEC_URL: ${{ secrets.COSMOS_BUILD_SPEC_URL }}
      COSMOS_BUILD_CALLBACK_URL: ${{ secrets.COSMOS_BUILD_CALLBACK_URL }}
      COSMOS_BUILD_REPOSITORY_TOKEN: ${{ secrets.COSMOS_BUILD_REPOSITORY_TOKEN }}
    steps:
      - name: Checkout runall
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: prtmax/runall
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.2'
      - name: Resolve locked executor tools
        run: dart pub get --enforce-lockfile --directory tools/cosmos_executor

      - name: Prepare frozen run inputs and shared source
        id: meta
        shell: bash
        run: ./scripts/prepare-chunk

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install locked artifact client
        run: npm ci --ignore-scripts --prefix tools/artifact_upload
      - name: Upload per-run inputs and shared source workspaces
        uses: ./tools/artifact_upload
        with:
          manifest: prepared/uploads.json
      - name: Report preparation upload failure
        if: failure()
        shell: bash
        run: ./scripts/report-chunk-failure
