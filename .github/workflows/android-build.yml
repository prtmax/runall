name: Cosmos app build

run-name: cosmos-build-${{ inputs.build_run_id }}

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Mercury platform build run id
        required: true
        type: string

# Compile must not receive id-token. Sensitive jobs opt in below.
permissions:
  contents: read

jobs:
  prepare:
    permissions:
      contents: read
      id-token: write
    uses: prtmax/runall/.github/workflows/reusable-prepare.yml@9ba31438f71eaa1d12d6812d962afece91669ff3
    with:
      build_run_id: ${{ inputs.build_run_id }}
    secrets:
      COSMOS_BUILD_AUTH_EXCHANGE_URL: ${{ secrets.COSMOS_BUILD_AUTH_EXCHANGE_URL }}
      COSMOS_BUILD_SPEC_URL: ${{ secrets.COSMOS_BUILD_SPEC_URL }}
      COSMOS_BUILD_CALLBACK_URL: ${{ secrets.COSMOS_BUILD_CALLBACK_URL }}
      COSMOS_BUILD_REPOSITORY_TOKEN: ${{ secrets.COSMOS_BUILD_REPOSITORY_TOKEN }}

  build-android:
    needs: prepare
    if: needs.prepare.outputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout runall
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download build spec
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.8
        with:
          name: build-spec-${{ inputs.build_run_id }}
          path: .

      - name: Download source workspace
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.8
        with:
          name: source-workspace-${{ inputs.build_run_id }}
          path: packed

      - name: Download frozen resources
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.8
        with:
          name: frozen-resources-${{ inputs.build_run_id }}
          path: frozen-resources

      - name: Unpack source workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace
          tar -xf packed/source-workspace.tar -C workspace

      - name: Set up Java
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/ensure-flutter --spec build-spec.json --workspace workspace --env-file flutter.env

      - name: Build unsigned Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unsigned
          export RUNALL_FROZEN_RESOURCE_ROOT="${PWD}/frozen-resources"
          test -f "${RUNALL_FROZEN_RESOURCE_ROOT}/index.json"
          ./scripts/build-android --spec build-spec.json --workspace workspace --output-dir "${PWD}/unsigned"

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-${{ inputs.build_run_id }}
          path: unsigned/
          if-no-files-found: error

  sign-android:
    needs: [prepare, build-android]
    if: needs.prepare.outputs.platform == 'android' && needs.build-android.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: prtmax/runall/.github/workflows/reusable-sign-android.yml@71760a416d9b5161ae0a1aef8359a0af68b36a07
    with:
      build_run_id: ${{ inputs.build_run_id }}
      application_id: ${{ needs.prepare.outputs.application_id }}
    secrets:
      COSMOS_BUILD_AUTH_EXCHANGE_URL: ${{ secrets.COSMOS_BUILD_AUTH_EXCHANGE_URL }}
      COSMOS_BUILD_CALLBACK_URL: ${{ secrets.COSMOS_BUILD_CALLBACK_URL }}
      COSMOS_BUILD_SIGN_MATERIAL_URL: ${{ secrets.COSMOS_BUILD_SIGN_MATERIAL_URL }}

  finalize-android:
    needs: [prepare, build-android, sign-android]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.platform == 'android' &&
      (needs.sign-android.result == 'success' || needs.sign-android.result == 'failure' || needs.build-android.result == 'failure')
    permissions:
      contents: read
      id-token: write
    uses: prtmax/runall/.github/workflows/reusable-finalize-android.yml@71760a416d9b5161ae0a1aef8359a0af68b36a07
    with:
      build_run_id: ${{ inputs.build_run_id }}
      upstream_result: ${{ needs.sign-android.result == 'success' && 'success' || 'failure' }}
    secrets:
      COSMOS_BUILD_AUTH_EXCHANGE_URL: ${{ secrets.COSMOS_BUILD_AUTH_EXCHANGE_URL }}
      COSMOS_BUILD_CALLBACK_URL: ${{ secrets.COSMOS_BUILD_CALLBACK_URL }}
      COSMOS_BUILD_ARTIFACT_UPLOAD_URL: ${{ secrets.COSMOS_BUILD_ARTIFACT_UPLOAD_URL }}

  build-ios:
    needs: prepare
    if: needs.prepare.outputs.platform == 'ios'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout runall
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download build spec
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.8
        with:
          name: build-spec-${{ inputs.build_run_id }}
          path: .

      - name: Download source workspace
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.8
        with:
          name: source-workspace-${{ inputs.build_run_id }}
          path: packed

      - name: Download frozen resources
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.8
        with:
          name: frozen-resources-${{ inputs.build_run_id }}
          path: frozen-resources

      - name: Unpack source workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace
          tar -xf packed/source-workspace.tar -C workspace

      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/ensure-flutter --spec build-spec.json --workspace workspace --env-file flutter.env

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unsigned
          export RUNALL_FROZEN_RESOURCE_ROOT="${PWD}/frozen-resources"
          test -f "${RUNALL_FROZEN_RESOURCE_ROOT}/index.json"
          ./scripts/build-ios --spec build-spec.json --workspace workspace --output-dir "${PWD}/unsigned"

      - name: Upload unsigned app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-${{ inputs.build_run_id }}
          path: unsigned/
          if-no-files-found: error

  sign-ios:
    needs: [prepare, build-ios]
    if: needs.prepare.outputs.platform == 'ios' && needs.build-ios.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: prtmax/runall/.github/workflows/reusable-sign-ios.yml@03ca65293300edc9c488c17e9cd01e3463673f87
    with:
      build_run_id: ${{ inputs.build_run_id }}
    secrets:
      COSMOS_BUILD_AUTH_EXCHANGE_URL: ${{ secrets.COSMOS_BUILD_AUTH_EXCHANGE_URL }}
      COSMOS_BUILD_CALLBACK_URL: ${{ secrets.COSMOS_BUILD_CALLBACK_URL }}
      COSMOS_BUILD_SIGN_MATERIAL_URL: ${{ secrets.COSMOS_BUILD_SIGN_MATERIAL_URL }}

  finalize-ios:
    needs: [prepare, build-ios, sign-ios]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.platform == 'ios' &&
      (needs.sign-ios.result == 'success' || needs.sign-ios.result == 'failure' || needs.build-ios.result == 'failure')
    permissions:
      contents: read
      id-token: write
    uses: prtmax/runall/.github/workflows/reusable-finalize-ios.yml@b1f6b78da96112e22bdd2625dba70072945ceb6e
    with:
      build_run_id: ${{ inputs.build_run_id }}
      upstream_result: ${{ needs.sign-ios.result == 'success' && 'success' || 'failure' }}
    secrets:
      COSMOS_BUILD_AUTH_EXCHANGE_URL: ${{ secrets.COSMOS_BUILD_AUTH_EXCHANGE_URL }}
      COSMOS_BUILD_CALLBACK_URL: ${{ secrets.COSMOS_BUILD_CALLBACK_URL }}
      COSMOS_BUILD_ARTIFACT_UPLOAD_URL: ${{ secrets.COSMOS_BUILD_ARTIFACT_UPLOAD_URL }}
