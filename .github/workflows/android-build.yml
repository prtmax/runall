name: Cosmos app build

run-name: cosmos-build-${{ inputs.build_run_id }}

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Mercury platform build run id
        required: true
        type: string
      build_run_ids:
        description: Comma-separated platform run ids (defaults to build_run_id)
        required: false
        type: string

# Compile must not receive id-token. Sensitive jobs opt in below.
permissions:
  contents: read

jobs:
  prepare:
    permissions:
      contents: read
      id-token: write
    uses: prtmax/runall/.github/workflows/reusable-prepare.yml@cdea94792a52f4bcfe1bd04fda3d3de27176cd5b
    with:
      build_run_id: ${{ inputs.build_run_id }}
      build_run_ids: ${{ inputs.build_run_ids }}
    secrets:
      COSMOS_BUILD_AUTH_EXCHANGE_URL: ${{ secrets.COSMOS_BUILD_AUTH_EXCHANGE_URL }}
      COSMOS_BUILD_SPEC_URL: ${{ secrets.COSMOS_BUILD_SPEC_URL }}
      COSMOS_BUILD_CALLBACK_URL: ${{ secrets.COSMOS_BUILD_CALLBACK_URL }}
      COSMOS_BUILD_REPOSITORY_TOKEN: ${{ secrets.COSMOS_BUILD_REPOSITORY_TOKEN }}

  build-android:
    needs: prepare
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.has_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        item: ${{ fromJson(needs.prepare.outputs.android_matrix) }}
    permissions:
      contents: read
    steps:
      - name: Checkout runall
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: prtmax/runall
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.2'
      - name: Resolve locked executor tools
        run: dart pub get --enforce-lockfile --directory tools/cosmos_executor

      - name: Download build spec
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.8
        with:
          name: build-spec-${{ matrix.item.build_run_id }}
          path: .

      - name: Download source workspace
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.8
        with:
          name: source-workspace-${{ matrix.item.source_sha }}
          path: packed

      - name: Download frozen resources
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.8
        with:
          name: frozen-resources-${{ matrix.item.build_run_id }}
          path: frozen-resources

      - name: Unpack source workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace
          tar -xf packed/source-workspace.tar -C workspace

      - name: Set up Java
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Flutter SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/fvm/versions
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('workspace/.fvmrc') }}
      - name: Restore pub cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('workspace/**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Restore Gradle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('workspace/**/*.gradle*', 'workspace/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/ensure-flutter --spec build-spec.json --workspace workspace --env-file flutter.env

      - name: Build unsigned Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unsigned
          export RUNALL_FROZEN_RESOURCE_ROOT="${PWD}/frozen-resources"
          test -f "${RUNALL_FROZEN_RESOURCE_ROOT}/index.json"
          ./scripts/build-android --spec build-spec.json --workspace workspace --output-dir "${PWD}/unsigned"

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-${{ matrix.item.build_run_id }}
          path: unsigned/
          if-no-files-found: error

  sign-android:
    needs: [prepare, build-android]
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.has_android == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        item: ${{ fromJson(needs.prepare.outputs.android_matrix) }}
    permissions:
      contents: read
      id-token: write
    uses: prtmax/runall/.github/workflows/reusable-sign-android.yml@cdea94792a52f4bcfe1bd04fda3d3de27176cd5b
    with:
      build_run_id: ${{ matrix.item.build_run_id }}
      application_id: ${{ matrix.item.application_id }}
    secrets:
      COSMOS_BUILD_AUTH_EXCHANGE_URL: ${{ secrets.COSMOS_BUILD_AUTH_EXCHANGE_URL }}
      COSMOS_BUILD_CALLBACK_URL: ${{ secrets.COSMOS_BUILD_CALLBACK_URL }}
      COSMOS_BUILD_SIGN_MATERIAL_URL: ${{ secrets.COSMOS_BUILD_SIGN_MATERIAL_URL }}

  finalize-android:
    needs: [prepare, build-android, sign-android]
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.has_android == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        item: ${{ fromJson(needs.prepare.outputs.android_matrix) }}
    permissions:
      contents: read
      id-token: write
    uses: prtmax/runall/.github/workflows/reusable-finalize-android.yml@cdea94792a52f4bcfe1bd04fda3d3de27176cd5b
    with:
      build_run_id: ${{ matrix.item.build_run_id }}
    secrets:
      COSMOS_BUILD_AUTH_EXCHANGE_URL: ${{ secrets.COSMOS_BUILD_AUTH_EXCHANGE_URL }}
      COSMOS_BUILD_CALLBACK_URL: ${{ secrets.COSMOS_BUILD_CALLBACK_URL }}
      COSMOS_BUILD_ARTIFACT_UPLOAD_URL: ${{ secrets.COSMOS_BUILD_ARTIFACT_UPLOAD_URL }}

  build-ios:
    needs: prepare
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.has_ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        item: ${{ fromJson(needs.prepare.outputs.ios_matrix) }}
    permissions:
      contents: read
    steps:
      - name: Checkout runall
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: prtmax/runall
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.2'
      - name: Resolve locked executor tools
        run: dart pub get --enforce-lockfile --directory tools/cosmos_executor

      - name: Download build spec
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.8
        with:
          name: build-spec-${{ matrix.item.build_run_id }}
          path: .

      - name: Download source workspace
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.8
        with:
          name: source-workspace-${{ matrix.item.source_sha }}
          path: packed

      - name: Download frozen resources
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.8
        with:
          name: frozen-resources-${{ matrix.item.build_run_id }}
          path: frozen-resources

      - name: Unpack source workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspace
          tar -xf packed/source-workspace.tar -C workspace

      - name: Restore Flutter SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/fvm/versions
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('workspace/.fvmrc') }}
      - name: Restore pub cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('workspace/**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install pinned Flutter
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/ensure-flutter --spec build-spec.json --workspace workspace --env-file flutter.env

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p unsigned
          export RUNALL_FROZEN_RESOURCE_ROOT="${PWD}/frozen-resources"
          test -f "${RUNALL_FROZEN_RESOURCE_ROOT}/index.json"
          ./scripts/build-ios --spec build-spec.json --workspace workspace --output-dir "${PWD}/unsigned"

      - name: Upload unsigned app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-${{ matrix.item.build_run_id }}
          path: unsigned/
          if-no-files-found: error

  sign-ios:
    needs: [prepare, build-ios]
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.has_ios == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        item: ${{ fromJson(needs.prepare.outputs.ios_matrix) }}
    permissions:
      contents: read
      id-token: write
    uses: prtmax/runall/.github/workflows/reusable-sign-ios.yml@cdea94792a52f4bcfe1bd04fda3d3de27176cd5b
    with:
      build_run_id: ${{ matrix.item.build_run_id }}
    secrets:
      COSMOS_BUILD_AUTH_EXCHANGE_URL: ${{ secrets.COSMOS_BUILD_AUTH_EXCHANGE_URL }}
      COSMOS_BUILD_CALLBACK_URL: ${{ secrets.COSMOS_BUILD_CALLBACK_URL }}
      COSMOS_BUILD_SIGN_MATERIAL_URL: ${{ secrets.COSMOS_BUILD_SIGN_MATERIAL_URL }}

  finalize-ios:
    needs: [prepare, build-ios, sign-ios]
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.has_ios == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        item: ${{ fromJson(needs.prepare.outputs.ios_matrix) }}
    permissions:
      contents: read
      id-token: write
    uses: prtmax/runall/.github/workflows/reusable-finalize-ios.yml@cdea94792a52f4bcfe1bd04fda3d3de27176cd5b
    with:
      build_run_id: ${{ matrix.item.build_run_id }}
    secrets:
      COSMOS_BUILD_AUTH_EXCHANGE_URL: ${{ secrets.COSMOS_BUILD_AUTH_EXCHANGE_URL }}
      COSMOS_BUILD_CALLBACK_URL: ${{ secrets.COSMOS_BUILD_CALLBACK_URL }}
      COSMOS_BUILD_ARTIFACT_UPLOAD_URL: ${{ secrets.COSMOS_BUILD_ARTIFACT_UPLOAD_URL }}
