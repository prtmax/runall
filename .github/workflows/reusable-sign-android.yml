name: Cosmos build sign-android

on:
  workflow_call:
    inputs:
      build_run_id:
        required: true
        type: string
      application_id:
        required: true
        type: string
    secrets:
      COSMOS_BUILD_AUTH_EXCHANGE_URL:
        required: true
      COSMOS_BUILD_CALLBACK_URL:
        required: true
      COSMOS_BUILD_SIGN_MATERIAL_URL:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  sign-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      COSMOS_BUILD_SIGN_MATERIAL_URL: ${{ secrets.COSMOS_BUILD_SIGN_MATERIAL_URL }}
      COSMOS_BUILD_CALLBACK_URL: ${{ secrets.COSMOS_BUILD_CALLBACK_URL }}
      COSMOS_BUILD_AUTH_EXCHANGE_URL: ${{ secrets.COSMOS_BUILD_AUTH_EXCHANGE_URL }}
    steps:
      - name: Checkout runall
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download build spec
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.8
        with:
          name: build-spec-${{ inputs.build_run_id }}
          path: spec

      - name: Download unsigned artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.8
        with:
          name: unsigned-${{ inputs.build_run_id }}
          path: unsigned

      - name: Exchange OIDC for sign credential
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/exchange-build-credential --run-id "$BUILD_RUN_ID" --output-env "$GITHUB_ENV"

      - name: Report sign phase
        shell: bash
        run: ./scripts/report-result --status running --phase sign --run-id "$BUILD_RUN_ID"

      - name: Set up Java
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          if command -v zipalign >/dev/null 2>&1 && command -v apksigner >/dev/null 2>&1 && command -v aapt >/dev/null 2>&1; then exit 0; fi
          echo "zipalign, apksigner, and aapt must be on PATH (install Android build-tools in runner image)"
          exit 1

      - name: Sign Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f spec/build-spec.json ]]; then
            spec="spec/build-spec.json"
          elif [[ -f spec/build-spec/build-spec.json ]]; then
            spec="spec/build-spec/build-spec.json"
          else
            spec="$(find spec -name build-spec.json -print -quit)"
          fi
          test -n "$spec" && test -f "$spec"
          mkdir -p signed
          shopt -s nullglob
          signed_any=0
          for apk in unsigned/*.apk; do
            base="$(basename "$apk")"
            ./scripts/sign-android \
              --spec "$spec" \
              --input "$apk" \
              --output "signed/${base}" \
              --expected-package "${{ inputs.application_id }}"
            signed_any=1
          done
          for aab in unsigned/*.aab; do
            base="$(basename "$aab")"
            ./scripts/sign-aab \
              --spec "$spec" \
              --input "$aab" \
              --output "signed/${base}"
            signed_any=1
          done
          if [[ "$signed_any" -eq 0 ]]; then
            echo "no apk or aab to sign"
            exit 1
          fi

      - name: Upload signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-${{ inputs.build_run_id }}
          path: signed/
          if-no-files-found: error

      - name: Report sign failure
        if: failure()
        shell: bash
        run: ./scripts/report-result --status failed --phase sign --run-id "$BUILD_RUN_ID" --error-message "runall android sign failed" || true
